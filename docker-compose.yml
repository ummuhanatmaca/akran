version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: akran_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akran_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akran_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-akran_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akran_user} -d ${POSTGRES_DB:-akran_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akran_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-akran_user}:${POSTGRES_PASSWORD:-akran_secure_password_2026}@postgres:5432/${POSTGRES_DB:-akran_db}
      SECRET_KEY: ${SECRET_KEY:-akran-super-secret-production-and-graduation-key-2026-secure}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@akran.edu.tr}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminAkran2026!}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: akran_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  backend_uploads:
