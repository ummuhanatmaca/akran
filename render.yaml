services:
  - type: web
    name: akran-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: akran-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@akran.edu.tr
      - key: INITIAL_ADMIN_PASSWORD
        value: AdminAkran2026!
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads

databases:
  - name: akran-postgres
    databaseName: akran_db
    user: akran_user
    plan: free
    region: frankfurt
